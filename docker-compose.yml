version: '3.8'

services:
  nsz-to-nsp-webgui:
    build: .
    ports:
      - "8002:8000"
    volumes:
      # Mount volumes for persistent storage of uploads, outputs, and keys
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./keys:/app/keys
      # Mount source code for development (optional, remove in production)
      - .:/app
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=production  # Change to development if needed
    restart: unless-stopped
    networks:
      - nsz-network

networks:
  nsz-network:
    driver: bridge